<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Market Insight AI - MJ Clone</title><script src="https://cdn.tailwindcss.com"></script>
<style>body{background:#0A0E1A;color:#E2E8F0;font-family:Inter,sans-serif}.card{background:linear-gradient(180deg,#151A2D 0%,#101528 100%);border:1px solid #1E2A4A;border-radius:20px}</style>
</head><body class="p-6">
<div class="max-w-[420px] mx-auto">
<h1 class="text-[32px] font-extrabold text-blue-400 leading-none">Market Insight AI</h1>
<p class="text-sm text-slate-400 mt-2">Welcome back, MJ • LIMITLESS EDITION</p>

<div class="card p-6 mt-8">
<div class="inline-flex items-center gap-2 bg-yellow-500/15 border border-yellow-500/30 text-yellow-400 text-xs font-bold px-3 py-1.5 rounded-full">⏳ LIVE NOW • No Approval Needed</div>
<h2 class="text-[28px] font-bold mt-6 leading-tight">Choose Your Access</h2>
<p class="text-slate-400 text-sm mt-2">Select the signals you want lifetime access to. One-time payment — <span class="text-emerald-400 font-bold">FREE for you</span>.</p>

<div class="mt-6 grid gap-4">
<button onclick="selectMode('matches')" id="btnMatches" class="card p-5 text-left border-blue-500/50 ring-1 ring-blue-500/20">
<div class="text-blue-400 font-bold">Matches</div>
<div class="text-[28px] font-extrabold">$0 <span class="text-sm font-normal text-slate-400">was $300</span></div>
<div class="text-xs text-slate-400">Last Digit Match Predictions</div>
<div class="mt-3 text-xs text-emerald-400" id="matchInfo">10% probability • Target 5: 0 matches</div>
</button>

<button onclick="selectMode('overunder')" id="btnOver" class="card p-5 text-left border-orange-500/30">
<div class="text-orange-400 font-bold">Over/Under</div>
<div class="text-[28px] font-extrabold">$0 <span class="text-sm font-normal text-slate-400">was $300</span></div>
<div class="text-xs text-slate-400">Most popular</div>
<div class="mt-3 text-xs text-orange-300" id="overInfo">Over 4: 50% • Under 4: 50%</div>
</button>
</div>
</div>

<div class="card p-4 mt-4">
<select id="market" class="w-full bg-black border border-[#1E2A4A] rounded-xl p-2.5 text-sm"><option value="R_100" selected>Vol 100</option><option value="R_50">Vol 50</option><option value="R_25">Vol 25</option></select>
<div class="flex gap-2 mt-3"><div class="flex-1 bg-black border border-[#1E2A4A] rounded-xl p-2"><div class="text-[10px] text-slate-500">LAST DIGIT</div><div id="lastDigit" class="text-2xl font-bold text-blue-400">-</div></div><div class="flex-1 bg-black border border-[#1E2A4A] rounded-xl p-2"><div class="text-[10px] text-slate-500">LIVE TICKS</div><div id="tickCount" class="text-2xl font-bold">0</div></div></div>
<div id="ticks" class="flex flex-wrap gap-1 mt-3"></div>
</div>
</div>
<script>
let target=5,ticks=[],socket=null,mode='matches';
function selectMode(m){mode=m;document.getElementById('btnMatches').classList.toggle('ring-1',m==='matches');document.getElementById('btnOver').classList.toggle('ring-1',m==='overunder');}
function addDigit(d){ticks.unshift(d);if(ticks.length>60)ticks.pop();document.getElementById('lastDigit').innerText=d;document.getElementById('tickCount').innerText=ticks.length;let h='';ticks.forEach(x=>{let match=x===target;h+=`<span style="width:30px;height:30px;display:flex;align-items:center;justify-content:center;border-radius:8px;font-weight:700;font-size:12px;${match?'background:#3b82f6;color:white':'background:#111;border:1px solid #222;color:#888'}">${x}</span>`});document.getElementById('ticks').innerHTML=h;let mc=ticks.filter(v=>v===target).length;document.getElementById('matchInfo').innerText=`${mc} Matches / ${ticks.length-mc} Differs • ${((mc/ticks.length)*100||0).toFixed(1)}%`;let over=ticks.filter(v=>v>4).length;document.getElementById('overInfo').innerText=`Over 4: ${((over/ticks.length)*100||0).toFixed(1)}% • Under 4: ${(((ticks.length-over)/ticks.length)*100||0).toFixed(1)}%`;}
function connect(){let m=document.getElementById('market').value;if(socket)try{socket.close()}catch(e){};socket=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");socket.onopen=()=>socket.send(JSON.stringify({ticks:m,subscribe:1}));socket.onmessage=e=>{let d=JSON.parse(e.data);if(d.tick){let q=d.tick.quote.toString().split('.');let digit=parseInt(q[1].slice(-1));addDigit(digit);}};socket.onclose=()=>setTimeout(connect,2000);}
document.getElementById('market').onchange=()=>{ticks=[];connect();};connect();
</script>
</body></html>
