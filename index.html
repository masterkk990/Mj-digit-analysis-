<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>JM Digit Analyzer — Live Deriv</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  font-family:Arial,Helvetica,sans-serif;
  background:#07111f;
  color:#eef4ff;
}

header{
  padding:18px;
  background:#0b1728;
  border-bottom:1px solid #20324d;
  position:sticky;
  top:0;
  z-index:10;
}

h1{
  margin:0;
  font-size:22px;
}

.subtitle{
  margin-top:6px;
  color:#91a4bf;
  font-size:13px;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:15px;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:15px;
}

select,
button{
  width:100%;
  min-height:46px;
  border-radius:9px;
  border:1px solid #29405f;
  background:#101e31;
  color:white;
  padding:10px;
  font-size:15px;
}

button{
  cursor:pointer;
  font-weight:bold;
}

button:hover{
  background:#162a45;
}

.connect{
  border-color:#26734d;
}

.stop{
  border-color:#793b3b;
}

.status{
  padding:13px;
  border-radius:9px;
  background:#101c2d;
  border:1px solid #243853;
  margin-bottom:15px;
  font-size:14px;
}

.status-dot{
  display:inline-block;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#ff5555;
  margin-right:7px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:15px;
}

.card{
  background:#0d192a;
  border:1px solid #21344f;
  border-radius:10px;
  padding:15px;
}

.card-title{
  color:#8fa5c2;
  font-size:12px;
  text-transform:uppercase;
  margin-bottom:8px;
}

.big{
  font-size:27px;
  font-weight:bold;
}

.green{
  color:#45e68b;
}

.red{
  color:#ff6868;
}

.yellow{
  color:#ffd166;
}

.blue{
  color:#63b3ff;
}

.section{
  margin-top:15px;
}

.section h2{
  font-size:17px;
  margin:0 0 10px;
}

.digits{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
}

.digit{
  text-align:center;
  background:#101e31;
  border:1px solid #253a57;
  border-radius:8px;
  padding:9px 3px;
}

.digit-number{
  font-size:17px;
  font-weight:bold;
}

.digit-percent{
  font-size:11px;
  color:#90a4bf;
  margin-top:4px;
}

.signal{
  padding:20px;
  border-radius:11px;
  background:#0d192a;
  border:1px solid #28415f;
  text-align:center;
}

.signal-name{
  font-size:25px;
  font-weight:bold;
}

.signal-detail{
  margin-top:8px;
  color:#9cb0ca;
}

.confidence{
  font-size:35px;
  font-weight:bold;
  margin-top:8px;
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  max-height:160px;
  overflow:auto;
}

.history-digit{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:6px;
  background:#17263b;
  border:1px solid #2b405d;
  font-weight:bold;
}

.diagnostics{
  background:#050b13;
  border:1px solid #1e3047;
  border-radius:9px;
  padding:12px;
  font-family:monospace;
  font-size:12px;
  max-height:260px;
