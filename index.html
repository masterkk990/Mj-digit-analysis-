<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matches Signal Scanner - MJ PRO FIXED</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-3 bg-[#eef7ff]">
<div class="max-w-[400px] mx-auto">
<div class="bg-white rounded-[20px] border border-blue-100 p-4 shadow">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">M</div><div><div class="font-bold text-[15px]">Matches Signal Scanner</div><div class="text-[10px] text-slate-400">protraderanalysistool.com</div></div></div>

<div class="mt-5 flex justify-between items-center"><span class="text-[12px] font-extrabold">TRADE MATCH</span><span id="marketLabel" class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-full">Volatility 100 Index</span></div>
<div class="mt-2 w-full h-2 bg-slate-100 rounded-full"><div id="progress" class="h-full bg-blue-500 rounded-full" style="width:0%"></div></div>
<div class="flex justify-between mt-1"><span id="digitCounts" class="text-[10px] text-slate-400">Loading...</span><span class="text-[10px] text-slate-400">Last 100 ticks</span></div>

<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="scan()" class="bg-slate-100 py-2.5 rounded-xl text-xs font-bold">🔄 Re-scan market</button>
<button onclick="scan()" class="bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold">Re-scan</button>
</div>

<div class="mt-3 flex gap-3 text-[11px]"><label><input type="checkbox" checked> Matches</label><label><input type="checkbox"> Differs</label><span class="ml-auto text-[9px] text-slate-400" id="status">CONNECTING...</span></div>

<div class="mt-3 bg-[#f0fdf4] border border-emerald-100 rounded-xl p-3">
<div class="flex justify-between"><span class="text-[10px] font-bold text-emerald-700 tracking-widest">MATCHES SIGNAL</span><span id="timeStamp" class="text-[10px] text-slate-500">--</span></div>
<div class="flex items-center gap-3 mt-2">
<div id="signalDigit" class="w-12 h-12 bg-slate-300 rounded-xl flex items-center justify-center text-2xl font-bold text-white">-</div>
<div><div class="text-[10px] text-slate-500">CONFIDENCE</div><div id="confidence" class="text-xl font-bold">--%</div></div>
<div class="ml-auto"><div id="liveStream" class="text-[16px] font-bold">----.--</div></div>
</div>
</div>

<div class="mt-4"><div class="text-[11px] font-bold">Live Tick Stream <span id="lastDigit" class="ml-2 text-blue-500"></span> <span id="streak" class="ml-2 text-amber-500"></span></div>
<div id="digitStream" class="flex flex-wrap gap-1 mt-2"></div></div>

<select id="market" class="w-full mt-4 bg-white border border-slate-200 rounded-lg p-2 text-xs"><option value="R_100" selected>Volatility 100 Index</option><option value="R_50">Volatility 50</option><option value="R_25">Volatility 25</option><option value="R_10">Volatility 10</option></select>
</div>
</div>

<script>
let ticks=[],target=0,socket=null,consec=0;
function update(){
 if(ticks.length<5)return;
 let c=Array(10).fill(0); ticks.forEach(t=>c[t]++);
 let max=Math.max(...c); let hot=c.indexOf(max);
 target=hot;
 let conf=(max/ticks.length*100).toFixed(1);
 document.getElementById('signalDigit').innerText=hot;
 document.getElementById('signalDigit').className="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-2xl font-bold text-white";
 document.getElementById('confidence').innerText=conf+"%";
 document.getElementById('confidence').className="text-xl font-bold text-emerald-600";
 document.getElementById('progress').style.width=conf+"%";
 document.getElementById('digitCounts').innerText=c.map(v=>v).join(" • ")+" = "+ticks.length;
 document.getElementById('timeStamp').innerText=new Date().toLocaleTimeString();
}
function add(p,d){
 ticks.unshift(d); if(ticks.length>100)ticks.pop();
 if(d===target)consec=0;else consec++;
 document.getElementById('liveStream').innerText=p;
 document.getElementById('lastDigit').innerText="LAST: "+d;
 document.getElementById('streak').innerText="DIFF: "+consec;
 document.getElementById('status').innerText="● LIVE "+ticks.length+" ticks";
 let h=''; ticks.slice(0,40).forEach(x=>{
  let m=x===target;
  h+=`<span style="width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:11px;margin:2px;${m?'background:#22c55e;color:#fff':'background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0'}">${x}</span>`;
 });
 document.getElementById('digitStream').innerHTML=h;
 update();
}
function connect(){
 let m=document.getElementById('market').value;
 if(socket)try{socket.close()}catch(e){}
 document.getElementById('status').innerText="CONNECTING "+m+"...";
 let ws=new WebSocket("wss://ws.binaryws.com/websockets/v3?app_id=1089");
 ws.onopen=()=>{ws.send(JSON.stringify({ticks:m,subscribe:1})); document.getElementById('status').innerText="CONNECTED "+m;};
 ws.onmessage=e=>{
  let d=JSON.parse(e.data);
  if(d.error){document.getElementById('status').innerText="ERR: "+d.error.message; return;}
  if(d.tick){
   let q=d.tick.quote;
   let s=q.toString(); let parts=s.split('.'); if(parts.length<2)return;
   let digit=parseInt(parts[1].slice(-1));
   if(!isNaN(digit)) add(s,digit);
  }
 };
 ws.onerror=()=>{document.getElementById('status').innerText="WS ERROR";};
 ws.onclose=()=>{document.getElementById('status').innerText="RECONNECTING..."; setTimeout(connect,1500);};
 socket=ws;
}
function scan(){ticks=[];consec=0;document.getElementById('digitStream').innerHTML="Scanning...";connect();}
document.getElementById('market').addEventListener('change',scan);
window.onload=connect;
</script>
</body></html>
