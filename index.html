<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matches Scanner + Volatility Selector</title>
<style>
body{font-family:Arial;background:#f2f5f9;margin:0;padding:10px}
.card{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.header{background:linear-gradient(90deg,#10b981,#0ea5e9);color:#fff;padding:15px;border-radius:12px 12px 0 0;margin:-12px -12px 12px -12px}
select{width:100%;padding:12px;border-radius:8px;border:2px solid #10b981;background:#e0f2fe;font-size:16px;font-weight:bold}
.tick{padding:6px;text-align:center;border-radius:6px;background:#e5e7eb;font-weight:bold}
.tick.hot{background:#10b981;color:#fff}
button{background:linear-gradient(90deg,#0d9488,#2563eb);color:#fff;border:none;padding:12px;border-radius:8px;width:100%;font-weight:bold;font-size:16px}
</style></head><body>

<div class="card">
<div class="header"><h2 style="margin:0">Matches Signal Scanner</h2></div>
<label style="font-weight:bold;color:#1e3a8a">🌐 Volatility Index Selection</label>
<select id="volatilitySelect" onchange="changeMarket()">
<option value="R_10">Volatility 10 Index</option>
<option value="R_25">Volatility 25 Index</option>
<option value="R_50">Volatility 50 Index</option>
<option value="R_75">Volatility 75 Index</option>
<option value="R_100" selected>Volatility 100 Index</option>
<option value="1HZ10V">Volatility 10 (1s)</option>
<option value="1HZ25V">Volatility 25 (1s)</option>
<option value="1HZ50V">Volatility 50 (1s)</option>
<option value="1HZ75V">Volatility 75 (1s)</option>
<option value="1HZ100V">Volatility 100 (1s)</option>
</select>
<small id="marketLabel" style="color:#059669;font-weight:bold;display:block;margin-top:6px">Analyzing: Volatility 100 Index</small>
</div>

<div class="card"><b>TRADE MATCH</b> <small id="tickCounter">97 of 100 ticks - HOT:4=28</small>
<div style="height:10px;background:#e5e7eb;border-radius:10px;margin:8px 0"><div style="width:97%;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9)"></div></div>
<div>0: 7 - 4: 28 HOT 29% | 1:6 5:7 2:8 6:10 3:8 7:7</div>
</div>

<div class="card"><b>Live Tick Stream - LAST: <span id="lastDigit">6</span></b>
<div id="tickStream" style="display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin-top:8px"></div>
<button onclick="rescan()" style="margin-top:10px">🔄 Re-scan market</button>
<small id="footerLabel">Volatility 100 Index - Sim Live</small>
</div>

<script>
const ticks=[6,1,4,7,4,4,2,4,4,9,4,3,3,4,0,4,2,9,5,0,8,4,4,1,7,4,4,5,5,9,2,4,5,4,4,6,6,2,6,3,4,4,4,1,3,4,6,4,0,4];
function renderTicks(){let h='';ticks.forEach(t=>{let cls=t==4?'tick hot':'tick';h+=`<div class="${cls}">${t}</div>`});document.getElementById('tickStream').innerHTML=h}
function changeMarket(){let s=document.getElementById('volatilitySelect');let txt=s.options[s.selectedIndex].text;document.getElementById('marketLabel').innerText='Analyzing: '+txt;document.getElementById('footerLabel').innerText=txt+' - Sim Live';rescan()}
function rescan(){renderTicks()}
renderTicks();
setInterval(()=>{let t=Math.floor(Math.random()*10);ticks.shift();ticks.push(t);renderTicks();document.getElementById('lastDigit').innerText=t},1500);
</script></body></html>
