<!DOCTYPE html>
<html lang="en">
<head>

<title>Matches Signal Scanner - MJ PRO</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
body{background:#eef7ff;font-family:Inter,sans-serif}

</style>

<body class="p-3 bg-[#eef7ff]">

<!-- HEADER -->

</div>
<div class="text-slate-400">≡</div>
</div>

<!-- TRADE MATCH -->
<div class="mt-5">
<div class="flex justify-between items-center">
<span class="text-[12px] font-extrabold tracking-widest text-slate-900">TRADE MATCH</span>
<span class="text-[10px] bg-blue-50 text-blue-600 px-2.5 py-1 rounded-full border border-blue-100">Volatility 100 Index - Last 100 ticks</span>

<div class="mt-2 w-full h-1.5 bg-slate-100 rounded-full overflow-hidden"><div id="progress" class="h-full bg-blue-500 transition-all" style="width:0%"></div></div>

<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="scan()" class="bg-slate-100 text-slate-700 text-[12px] font-bold py-2.5 rounded-xl">🔄 Re-scan market</button>
<button onclick="scan()" class="bg-blue-500 text-white text-[12px] font-bold py-2.5 rounded-xl">Re-scan</button>
</div>

<div class="mt-3 flex items-center gap-3 text-[11px] text-slate-600">
<label class="flex items-center gap-1"><input type="checkbox" checked> Matches</label>
<label class="flex items-center gap-1"><input type="checkbox"> Differs</label>
<label class="flex items-center gap-1"><input type="checkbox"> Signal</label>
<span class="ml-auto text-[9px] text-slate-400">Auto-generate every 59s</span>
</div>

<!-- SIGNAL BOX -->
<div class="mt-3 card bg-[#f0fdf4] border-emerald-100 p-3">
<div class="flex justify-between"><span class="text-[10px] font-bold tracking-widest text-emerald-700">MATCHES SIGNAL</span><span id="timeStamp" class="text-[10px] text-slate-500">--</span></div>
<div class="flex items-center gap-3 mt-2">
<div id="signalDigit" class="w-12 h-12 bg-slate-300 text-white rounded-xl flex items-center justify-center text-2xl font-bold">-</div>
<div><div class="text-[10px] text-slate-500">CONFIDENCE</div><div id="confidence" class="text-xl font-bold text-slate-400">--%</div></div>
