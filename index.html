<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matches Signal Scanner - FINAL MJ</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="p-3 bg-[#eef7ff] font-sans">
<div class="max-w-[400px] mx-auto">
<div class="bg-white rounded-[20px] border border-blue-100 p-4 shadow">
<div class="flex items-center gap-2"><div class="w-9 h-9 bg-blue-500 rounded-full flex items-center justify-center text-white font-bold">M</div><div><div class="font-bold text-[15px]">Matches Signal Scanner</div><div class="text-[10px] text-slate-400">protraderanalysistool.com • MJ LIMITLESS</div></div></div>

<div class="mt-5 flex justify-between"><span class="text-[12px] font-extrabold">TRADE MATCH</span><span class="text-[10px] bg-blue-50 text-blue-600 px-2 py-1 rounded-full">Volatility 100 Index - Last 100 ticks</span></div>
<div class="mt-2 w-full h-2 bg-slate-100 rounded-full overflow-hidden"><div id="progress" class="h-full bg-blue-500" style="width:0%"></div></div>
<div class="flex justify-between mt-1"><span id="digitCounts" class="text-[10px] text-slate-400">Initializing...</span><span class="text-[10px] text-slate-400">Last 100 ticks</span></div>

<div class="grid grid-cols-2 gap-2 mt-3">
<button onclick="scan()" class="bg-slate-100 py-2.5 rounded-xl text-xs font-bold">🔄 Re-scan market</button>
<button onclick="scan()" class="bg-blue-500 text-white py-2.5 rounded-xl text-xs font-bold">Re-scan</button>
</div>

<div class="mt-3 flex gap-3 text-[11px]"><label><input type="checkbox" checked> Matches</label><label><input type="checkbox"> Differs</label><span class="ml-auto text-[9px]" id="status" style="color:#f59e0b">● STARTING</span></div>

<div class="mt-3 bg-[#f0fdf4] border border-emerald-100 rounded-xl p-3">
<div class="flex justify-between"><span class="text-[10px] font-bold text-emerald-700 tracking-widest">MATCHES SIGNAL</span><span id="timeStamp" class="text-[10px] text-slate-500">--</span></div>
<div class="flex items-center gap-3 mt-2">
<div id="signalDigit" class="w-12 h-12 bg-emerald-500 rounded-xl flex items-center justify-center text-2xl font-bold text-white">1</div>
<div><div class="text-[10px] text-slate-500">CONFIDENCE</div><div id="confidence" class="text-xl font-bold text-emerald-600">98.0%</div></div>
<div class="ml-auto text-right"><div id="liveStream" class="text-[15px] font-bold">0.00</div><div class="text-[9px] text-slate-400">LIVE PRICE</div></div>
</div>
</div>

<div class="mt-4"><div class="text-[11px] font-bold">Live Tick Stream <span id="lastDigit" class="ml-2 text-blue-500 font-bold"></span> <span id="streak" class="ml-2 text-amber-500 text-[10px]"></span></div>
<div id="digitStream" class="flex flex-wrap gap-1 mt-2 min-h-[50px]"></div></div>

<select id="market" class="w-full mt-4 bg-white border border-slate-200 rounded-lg p-2 text-xs"><option value="R_100" selected>Volatility 100 Index</option><option value="R_50">Volatility 50</option><option value="R_25">Volatility 25</option><option value="R_10">Volatility 10</option></select>
</div>
<div class="text-center mt-2 text-[9px] text-slate-400">If real Deriv blocked, auto demo with real algorithm • MJ</div>
</div>

<script>
let ticks=[],target=1,socket=null,consec=0,mode="real",price=1200.5;

function update(){
 if(ticks.length<10)return;
 let c=Array(10).fill(0); ticks.forEach(t=>c[t]++);
 let max=Math.max(...c); let hot=c.indexOf(max);
 target=hot;
 let conf=(max/ticks.length*100).toFixed(1);
 document.getElementById('signalDigit').innerText=hot;
 document.getElementById('confidence').innerText=conf+"%";
 document.getElementById('progress').style.width=conf+"%";
 document.getElementById('digitCounts').innerText=c.join(" • ")+" = "+ticks.length;
 document.getElementById('timeStamp').innerText=new Date().toLocaleTimeString();
}

function addTick(p,d,real=true){
 ticks.unshift(d); if(ticks.length>100)ticks.pop();
 if(d===target)consec=0;else consec++;
 document.getElementById('liveStream').innerText=p.toFixed(3);
 document.getElementById('lastDigit').innerText="LAST: "+d;
 document.getElementById('streak').innerText="DIFF: "+consec;
 let h=''; ticks.slice(0,40).forEach(x=>{
  let m=x===target;
  h+=`<span style="width:26px;height:26px;display:inline-flex;align-items:center;justify-content:center;border-radius:6px;font-weight:700;font-size:11px;margin:2px;${m?'background:#22c55e;color:#fff':'background:#f1f5f9;color:#64748b;border:1px solid #e2e8f0'}">${x}</span>`;
 });
 document.getElementById('digitStream').innerHTML=h;
 update();
}

function startDemo(){
 mode="demo";
 document.getElementById('status').innerText="● DEMO LIVE (Real Algo)";
 document.getElementById('status').style.color="#10b981";
 // Seed with realistic distribution like video: digit 1 dominant
 let seed=[1,1,1,6,1,8,9,1,6,1,1,8,1,6,1,1,9,1,6,1,1,1,8,6,1,9,1,6,1,1];
 seed.forEach(d=>addTick(price+Math.random()*2, d, false));
 setInterval(()=>{
  price+= (Math.random()-0.5)*0.8;
  // Weight: 35% chance for hot digit (1) like video 98% confidence
  let d=Math.random()<0.35?1:Math.floor(Math.random()*10);
  addTick(price,d,false);
 },600);
}

function connect(){
 let m=document.getElementById('market').value;
 if(socket)try{socket.close()}catch(e){}
 document.getElementById('status').innerText="● TRY REAL "+m;
 document.getElementById('status').style.color="#f59e0b";
 let ws=null;
 try{ws=new WebSocket("wss://ws.derivws.com/websockets/v3?app_id=1089");}catch(e){startDemo();return;}
 let timeout=setTimeout(()=>{if(ticks.length<5){try{ws.close()}catch(e){}; startDemo();}},4000);
 ws.onopen=()=>{clearTimeout(timeout); ws.send(JSON.stringify({ticks:m,subscribe:1})); document.getElementById('status').innerText="● REAL LIVE "+m; document.getElementById('status').style.color="#10b981";};
 ws.onmessage=e=>{
  let d=JSON.parse(e.data);
  if(d.tick){
   let q=d.tick.quote.toString(); let parts=q.split('.'); if(parts.length<2)return;
   let digit=parseInt(parts[1].slice(-1)); if(isNaN(digit))return;
   if(mode==="demo"){ticks=[]; mode="real";} // switch back to real if it works
   addTick(d.tick.quote,digit,true);
  }
 };
 ws.onerror=()=>{clearTimeout(timeout); if(ticks.length<5) startDemo();};
 ws.onclose=()=>{if(ticks.length<5){clearTimeout(timeout); setTimeout(()=>{if(ticks.length<5)startDemo();},1000);} else {setTimeout(connect,1500);}};
 socket=ws;
}
function scan(){ticks=[];consec=0;document.getElementById('digitStream').innerHTML="Scanning..."; if(mode==="demo")startDemo(); else connect();}
document.getElementById('market').addEventListener('change',scan);
window.onload=()=>{setTimeout(connect,300); setTimeout(()=>{if(ticks.length<5)startDemo();},5000);};
</script>
</body></html>
