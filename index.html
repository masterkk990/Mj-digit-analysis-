<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07111f">

<title>JM Digit Analyzer</title>

<style>
*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
  background:#07111f;
  color:#f2f6ff;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
}

button,
select{
  font:inherit;
}

.app{
  width:100%;
  max-width:1150px;
  margin:0 auto;
  padding:16px;
}

header{
  background:#0d1a2b;
  border:1px solid #203552;
  border-radius:14px;
  padding:18px;
  margin-bottom:14px;
}

.logo{
  font-size:25px;
  font-weight:800;
}

.subtitle{
  color:#91a5bf;
  font-size:13px;
  margin-top:5px;
}

.status{
  display:flex;
  align-items:center;
  gap:9px;
  background:#0d1a2b;
  border:1px solid #203552;
  border-radius:10px;
  padding:13px;
  margin-bottom:14px;
  font-size:14px;
}

.status-dot{
  width:11px;
  height:11px;
  border-radius:50%;
  background:#ff5555;
  flex:none;
}

.controls{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-bottom:14px;
}

select,
button{
  min-height:48px;
  width:100%;
  border-radius:9px;
  border:1px solid #294361;
  background:#111f33;
  color:#fff;
  padding:10px 12px;
}

button{
  font-weight:700;
  cursor:pointer;
}

button:hover{
  background:#172b45;
}

.connect{
  border-color:#2e8b5b;
}

.stop{
  border-color:#934747;
}

.clear{
  border-color:#80672b;
}

.grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
  margin-bottom:14px;
}

.card{
  background:#0d1a2b;
  border:1px solid #203552;
  border-radius:12px;
  padding:15px;
}

.label{
  color:#8298b3;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.5px;
  margin-bottom:7px;
}

.value{
  font-size:24px;
  font-weight:800;
  word-break:break-word;
}

.green{
  color:#45e68b;
}

.red{
  color:#ff6666;
}

.yellow{
  color:#ffd166;
}

.blue{
  color:#63b3ff;
}

.section-title{
  font-size:17px;
  font-weight:800;
  margin:18px 0 9px;
}

.signal{
  text-align:center;
  background:#0d1a2b;
  border:1px solid #294361;
  border-radius:12px;
  padding:22px;
}

.signal-name{
  font-size:25px;
  font-weight:800;
}

.signal-confidence{
  font-size:36px;
  font-weight:800;
  margin-top:7px;
}

.signal-detail{
  color:#8fa4bf;
  font-size:13px;
  margin-top:8px;
}

.digits{
  display:grid;
  grid-template-columns:repeat(10,1fr);
  gap:6px;
}

.digit{
  background:#101f33;
  border:1px solid #243c59;
  border-radius:8px;
  text-align:center;
  padding:10px 3px;
}

.digit-number{
  font-size:18px;
  font-weight:800;
}

.digit-percent{
  color:#8da2bd;
  font-size:11px;
  margin-top:3px;
}

.history{
  display:flex;
  flex-wrap:wrap;
  gap:5px;
  max-height:170px;
  overflow:auto;
}

.history-item{
  width:32px;
  height:32px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#16263c;
  border:1px solid #29405d;
  border-radius:6px;
  font-weight:800;
}

.diagnostics{
  background:#050a11;
  border:1px solid #21344e;
  border-radius:10px;
  padding:12px;
  min-height:130px;
  max-height:300px;
  overflow:auto;
  font-family:monospace;
  font-size:12px;
  line-height:1.5;
  white-space:pre-wrap;
}

.error-box{
  display:none;
  background:#2a1013;
  border:1px solid #8d3c44;
  color:#ffb4b9;
  border-radius:10px;
  padding:13px;
  margin-bottom:14px;
  font-family:monospace;
  font-size:12px;
  white-space:pre-wrap;
}

.footer{
  text-align:center;
  color:#71859f;
  font-size:12px;
  padding:24px 0 10px;
}

@media(max-width:700px){

  .app{
    padding:10px;
  }

  .controls{
    grid-template-columns:1fr;
  }

  .grid{
    grid-template-columns:repeat(2,1fr);
  }

  .digits{
